apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
configMapGenerator:
  - name: ingress-parameters
    envs:
      - ingress-parameters.env
generatorOptions:
  disableNameSuffixHash: true
patches:
  - path: ingress-patch.yaml
    target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: system-ingress
replacements:
  - source:
      kind: ConfigMap
      name: ingress-parameters
      fieldPath: data.LOAD_BALANCER_ARN
    targets:
      - select:
          group: networking.k8s.io
          version: v1
          kind: Ingress
          name: system-ingress
        fieldPaths:
          - metadata.annotations.[alb.ingress.kubernetes.io/load-balancer-arn]