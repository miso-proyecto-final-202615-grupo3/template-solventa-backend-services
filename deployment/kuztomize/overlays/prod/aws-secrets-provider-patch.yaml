apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: aws-secrets-provider
spec:
  parameters:
    region: us-east-1
    usePodIdentity: "true"
    objects: |
      - objectName: "prod/solventa-backend/app-secrets"
        objectType: "secretsmanager"
        jmesPath:
            - path: "DATABASE_URL"
              objectAlias: "DATABASE_URL"
            - path: "S3_BUCKET_NAME"
              objectAlias: "S3_BUCKET_NAME"
            - path: "COGNITO_CLIENT_ID"
              objectAlias: "COGNITO_CLIENT_ID"
            - path: "KMS_KEY_ARN"
              objectAlias: "KMS_KEY_ARN"
    secretObjects:
      - secretName: solventa-prod-app-secrets
        type: Opaque
        data:
          - objectName: "DATABASE_URL"
            key: "DATABASE_URL"
          - objectName: "S3_BUCKET_NAME"
            key: "S3_BUCKET_NAME"
          - objectName: "COGNITO_CLIENT_ID"
            key: "COGNITO_CLIENT_ID"
          - objectName: "KMS_KEY_ARN"
            key: "KMS_KEY_ARN"
