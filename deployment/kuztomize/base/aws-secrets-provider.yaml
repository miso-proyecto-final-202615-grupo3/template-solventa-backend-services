apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: aws-secrets-provider
spec:
  provider: aws
  parameters:
    region: SET_IN_OVERLAY
    usePodIdentity: "true"
    objects: |
      - objectName: "SET_IN_OVERLAY"
        objectType: "secretsmanager"
        jmesPath:
            - path: "SET_IN_OVERLAY"
              objectAlias: "SET_IN_OVERLAY"
    secretObjects:
      - secretName: SET_IN_OVERLAY
        type: Opaque
        data:
          - objectName: "SET_IN_OVERLAY"
            key: "SET_IN_OVERLAY"
