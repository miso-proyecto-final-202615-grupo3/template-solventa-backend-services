apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-service
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/load-balancer-arn: "${LOAD_BALANCER_ARN}"
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 80