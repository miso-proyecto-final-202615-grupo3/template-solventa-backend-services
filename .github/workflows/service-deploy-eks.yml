name: "Service - Deploy to EKS"

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: "Select the environment to deploy to"
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod
        default: "dev"
      service_name:
        description: "Select the service to deploy"
        required: true
        type: choice
        options:
          - greeting_service
          - math_service
        default: greeting_service

permissions:
  contents: read
  id-token: write

jobs:
  service-deploy-eks:
    name: Deploy ${{ inputs.service_name }} to ${{ inputs.target_env }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_env }}
    timeout-minutes: 30
    env:
      DEPLOYMENT_ENV: ${{ inputs.target_env }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      SERVICE_NAME: ${{ inputs.service_name }}
      CLUSTER_NAME: solventa-${{ inputs.target_env }}-eks
      K8S_NAMESPACE: solventa-${{ inputs.target_env }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Configure EKS access
        run: aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"

      - name: Deploy backend chart
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          service_release="${SERVICE_NAME//_/-}"
          helm upgrade --install "$service_release" deployment/helm/charts/backend-service \
            --namespace "$K8S_NAMESPACE" \
            --values "deployment/helm/config/$SERVICE_NAME/values.yaml" \
            --values "deployment/helm/config/$SERVICE_NAME/values.$DEPLOYMENT_ENV.yaml" \
            --set-string image.tag="$GITHUB_SHA" \
            --set-string config.ENVIRONMENT="$DEPLOYMENT_ENV"

      - name: Wait for deployment rollout
        run: |
          service_slug="${SERVICE_NAME//_/-}"
          kubectl rollout status "deployment/$service_slug" --namespace "$K8S_NAMESPACE" --timeout=180s