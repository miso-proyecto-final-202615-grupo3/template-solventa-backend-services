name: "EKS - Setup Init"

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: Select the environment to set up
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod
        default: dev

permissions:
  contents: read
  id-token: write

jobs:
  eks-setup-init:
    name: Setup EKS for ${{ inputs.target_env }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_env }}
    timeout-minutes: 15
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      CLUSTER_NAME: solventa-${{ inputs.target_env }}-eks
      K8S_NAMESPACE: solventa-${{ inputs.target_env }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure EKS access
        run: aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"

      - name: Create namespace
        run: kubectl create namespace "$K8S_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

      - name: Create backend service secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          kubectl create secret generic backend-service-secrets \
            --namespace "$K8S_NAMESPACE" \
            --from-literal="DATABASE_URL=$DATABASE_URL" \
            --dry-run=client -o yaml | kubectl apply -f -
