name: "Backend App - Publish to ECR and Deploy to EKS"

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: "Select the environment to deploy to"
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod
        default: "dev"
      ecr_repo_url:
        description: "Select the ECR Repository URL"
        required: true
        type: choice
        options:
          - "179201404385.dkr.ecr.us-east-1.amazonaws.com/template-solventa-api"
        default: "179201404385.dkr.ecr.us-east-1.amazonaws.com/template-solventa-api"

permissions:
  contents: read
  id-token: write

jobs:
  backend-deploy-eks:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_env }}
    timeout-minutes: 30
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      CLUSTER_NAME: ${{ vars.CLUSTER_NAME }}
      ECR_REPO_URL: ${{ vars.ECR_REPO_URL }}
      LOAD_BALANCER_ARN: ${{ vars.LOAD_BALANCER_ARN }}
      DEPLOYMENT_ENV: ${{ inputs.target_env }}
      K8S_NAMESPACE: backend-${{ inputs.target_env }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.ECR_REPO_URL }}:${{ github.sha }}
            ${{ vars.ECR_REPO_URL }}:latest

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Configure EKS access
        run: aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"

      - name: Create namespace and database secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail

          kubectl create namespace "$K8S_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic backend-service-secrets \
            --namespace "$K8S_NAMESPACE" \
            --from-literal="DATABASE_URL=$DATABASE_URL" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy backend chart
        env:
          GITHUB_SHA: ${{ github.sha }}
          ECR_REPO_URL: ${{ vars.ECR_REPO_URL }}
        run: |
          helm upgrade --install backend-service deployment/helm/charts/backend-service \
            --namespace "$K8S_NAMESPACE" \
            --values deployment/helm/config/values.yaml \
            --set-string image.repository="$ECR_REPO_URL" \
            --set-string image.tag="$GITHUB_SHA" \
            --set-string config.ENVIRONMENT="$DEPLOYMENT_ENV"

      - name: Apply ingress with Kustomize
        run: kubectl apply -k deployment/kuztomize --namespace "$K8S_NAMESPACE"

      - name: Wait for deployment rollout
        run: kubectl rollout status deployment/backend-service --namespace "$K8S_NAMESPACE" --timeout=180s
